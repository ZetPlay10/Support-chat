spring.application.name=support-chat
server.port=8080

# PostgreSQL (vezi docker-compose.yml din radacina proiectului)
spring.datasource.url=jdbc:postgresql://localhost:5432/supportchat
spring.datasource.username=supportchat
spring.datasource.password=supportchat

# Schema o creeaza Flyway (src/main/resources/db/migration).
# Hibernate doar verifica faptul ca entitatile corespund tabelelor.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Erorile JSON includ mesajul exceptiei si erorile de validare (vede React ce s-a intamplat)
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=never
