spring.application.name=support-chat
server.port=8080

# PostgreSQL (vezi docker-compose.yml din radacina proiectului)
spring.datasource.url=jdbc:postgresql://localhost:5432/supportchat
spring.datasource.username=supportchat
spring.datasource.password=supportchat

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
